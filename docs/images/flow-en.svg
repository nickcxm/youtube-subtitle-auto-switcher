<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><rect width="1200" height="280" rx="22" fill="#f3f6ed"/><g font-family="Arial, PingFang SC, sans-serif"><text x="35" y="43" font-size="17" fill="#294a37" font-weight="700">A few frames. All on your device.</text><rect x="35" y="83" width="205" height="111" rx="15" fill="white" stroke="#d8e2cf"/><text x="51" y="110" fill="#6f8c62" font-size="11">01</text><text x="51" y="141" font-size="15" font-weight="700" fill="#294a37">Soft caption changes</text><text x="51" y="168" font-size="11" fill="#7c8b72">Select distinct cues</text><path d="M246 137 h18 m-5-5 5 5-5 5" fill="none" stroke="#809673" stroke-width="2"/><rect x="270" y="83" width="205" height="111" rx="15" fill="white" stroke="#d8e2cf"/><text x="286" y="110" fill="#6f8c62" font-size="11">02</text><text x="286" y="141" font-size="15" font-weight="700" fill="#294a37">Sample video frame</text><text x="286" y="168" font-size="11" fill="#7c8b72">Crop bottom region</text><path d="M481 137 h18 m-5-5 5 5-5 5" fill="none" stroke="#809673" stroke-width="2"/><rect x="505" y="83" width="205" height="111" rx="15" fill="white" stroke="#d8e2cf"/><text x="521" y="110" fill="#6f8c62" font-size="11">03</text><text x="521" y="141" font-size="15" font-weight="700" fill="#294a37">Local PaddleOCR</text><text x="521" y="168" font-size="11" fill="#7c8b72">WebGPU / WASM</text><path d="M716 137 h18 m-5-5 5 5-5 5" fill="none" stroke="#809673" stroke-width="2"/><rect x="740" y="83" width="205" height="111" rx="15" fill="white" stroke="#d8e2cf"/><text x="756" y="110" fill="#6f8c62" font-size="11">04</text><text x="756" y="141" font-size="15" font-weight="700" fill="#294a37">Compare evidence</text><text x="756" y="168" font-size="11" fill="#7c8b72">Two distinct matches</text><path d="M951 137 h18 m-5-5 5 5-5 5" fill="none" stroke="#809673" stroke-width="2"/><rect x="975" y="83" width="205" height="111" rx="15" fill="#254b37" stroke="#d8e2cf"/><text x="991" y="110" fill="#bcd1ab" font-size="11">05</text><text x="991" y="141" font-size="15" font-weight="700" fill="white">Switch YouTube CC</text><text x="991" y="168" font-size="11" fill="#bfd2b7">Undo / manual priority</text><text x="35" y="239" fill="#72846b" font-size="12">Insufficient evidence keeps captions on. No video uploads, accounts or usage quotas.</text></g></svg>